<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' | Periodismo Seguro'">Periodismo Seguro</title>
  <script th:src="@{/js/tema.js}"></script>
  <script th:src="@{/js/avisos.js}" defer></script>
  <script th:src="@{/js/carga.js}" defer></script>
  <script th:src="@{/js/validacion.js}" defer></script>
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
  <header class="cabecera" th:fragment="cabecera">
    <ul id="avisos" class="avisos" aria-live="polite" aria-label="Avisos de noticias nuevas"></ul>
    <a class="marca" th:href="@{/}">Periodismo Seguro</a>
    <nav class="nav" aria-label="Principal">
      <a th:href="@{/}">Inicio</a>
      <th:block th:if="${!conSesion}">
        <a th:href="@{/registro}">Registrarme</a>
        <a th:href="@{/login}">Entrar</a>
      </th:block>
      <th:block th:if="${conSesion}">
        <th:block th:if="${esPeriodista}">
          <a th:href="@{/inicio}">Mi panel</a>
          <a th:href="@{/mis-notas}">Mis notas</a>
          <a th:href="@{/noticias/nueva}">Escribir noticia</a>
        </th:block>
        <th:block th:if="${esLector}">
          <a th:href="@{/chat}" data-carga="Abriendo el chat de lectores…">Chat</a>
        </th:block>
        <form class="cierre" th:action="@{/logout}" method="post">
          <button type="submit" class="tema" id="cerrar-sesion">Cerrar sesión</button>
        </form>
      </th:block>
      <button type="button" class="interruptor" id="tema" role="switch" aria-checked="false" aria-label="Tema oscuro">
        <span class="interruptor-pista" aria-hidden="true"><span class="interruptor-bola"></span></span>
        <span class="interruptor-texto">Oscuro</span>
      </button>
    </nav>
  </header>

  <footer class="pie" th:fragment="pie">
    <p>Periodismo Seguro. Tu nombre real y tu correo nunca son públicos: publicas con un seudónimo.</p>
  </footer>
</body>
</html>
