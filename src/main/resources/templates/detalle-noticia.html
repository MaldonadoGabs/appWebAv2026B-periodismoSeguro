<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Noticia')}"></head>
<body>
  <header th:replace="~{fragments/base :: cabecera}"></header>
  <main class="pagina">
    <article class="panel">
      <h1 th:text="${noticia.titulo}">Encabezado</h1>
      <p class="lectura suave" th:text="${noticia.subtitulo}">Subtítulo</p>
      <div class="lectura" th:utext="${noticia.cuerpo}"></div>
      <ul class="miniaturas" th:if="${!#lists.isEmpty(noticia.imagenesIds)}" aria-label="Imágenes de la noticia">
        <li th:each="imagenId : ${noticia.imagenesIds}">
          <img th:src="@{/noticias/imagenes/{id}(id=${imagenId})}" alt="Imagen de la noticia">
        </li>
      </ul>
      <p class="firma">
        Publicado por <strong th:text="${noticia.autorSeudonimo}">Seudónimo</strong>
        <span th:if="${noticia.categoria != null}" th:text="' · ' + ${noticia.categoria}"> · categoría</span>
        <span th:text="' · ' + ${noticia.publicadaEn}"> · fecha de publicación</span>
        <span th:if="${noticia.modificadaEn != null}" th:text="' · Editada: ' + ${noticia.modificadaEn}"> · fecha de edición</span>
      </p>
    </article>
    <p><a class="boton" th:href="@{/}">Volver al inicio</a></p>
  </main>
  <footer th:replace="~{fragments/base :: pie}"></footer>
</body>
</html>
