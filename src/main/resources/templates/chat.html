<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Chat')}"></head>
<body>
  <header th:replace="~{fragments/base :: cabecera}"></header>
  <main class="pagina ancha" th:attr="data-yo=${yo}">
    <h1><span>Chat</span> de periodistas</h1>
    <p class="suave">Conversación entre periodistas. El nombre que ves es siempre un seudónimo; nunca se muestra el correo ni el nombre real.</p>
    <p class="suave">WebSocket: <span id="estado">desconectado</span></p>

    <div class="chat-shell">
      <section class="chat-conversacion" aria-label="Conversación">
        <ol id="log" class="conversacion"></ol>
        <p id="escribiendo" aria-live="polite"></p>
        <form id="f" class="chat-form">
          <label class="sr-only" for="t">Mensaje</label>
          <input id="t" maxlength="500" autocomplete="off" placeholder="Escribe un mensaje…">
          <button class="boton principal" type="submit">Enviar</button>
        </form>
      </section>

      <aside class="participantes" aria-label="Periodistas conectados">
        <h2>Conectados (<span id="total-conectados">0</span>)</h2>
        <ul id="conectados"><li class="suave">Sin conexión</li></ul>
      </aside>
    </div>

    <p><a th:href="@{/inicio}">Volver al panel</a></p>
  </main>
  <footer th:replace="~{fragments/base :: pie}"></footer>
  <script th:src="@{/js/chat.js}"></script>
</body>
</html>
