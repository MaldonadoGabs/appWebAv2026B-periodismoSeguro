<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Chat')}"></head>
<body>
  <header th:replace="~{fragments/base :: cabecera}"></header>
  <main class="pagina">
    <h1><span>Chat</span> de periodistas</h1>
    <p class="suave">Solo para periodistas con sesión iniciada. Los mensajes no muestran autor.</p>
    <p>WebSocket: <span id="estado">desconectado</span></p>

    <form id="f">
      <div class="campo">
        <label for="t">Mensaje</label>
        <input id="t" maxlength="500" autocomplete="off">
      </div>
      <button class="boton principal">Enviar</button>
    </form>

    <ul id="log"></ul>
    <p><a th:href="@{/inicio}">Volver al panel</a></p>
  </main>
  <footer th:replace="~{fragments/base :: pie}"></footer>
  <script th:src="@{/js/chat.js}"></script>
</body>
</html>
