<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Mi panel')}"></head>
<body>
  <header th:replace="~{fragments/base :: cabecera}"></header>
  <main class="pagina">
    <h1><span>Mi</span> panel</h1>
    <section class="panel">
      <p class="suave">Estás publicando como</p>
      <p class="lectura"><strong th:text="${seudonimo}">Seudónimo</strong></p>
      <p class="suave">Tu nombre real y tu correo nunca se muestran en el portal.</p>
    </section>

    <nav class="panel" aria-label="Accesos del periodista">
      <h2>Accesos</h2>
      <p><a class="boton principal" th:href="@{/noticias/nueva}">Escribir noticia</a>
         <a class="boton" th:href="@{/mis-notas}">Mis notas</a>
         <a class="boton" th:href="@{/chat}">Chat</a></p>
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="boton" id="cerrar-sesion-panel">Cerrar sesión</button>
      </form>
    </nav>
  </main>
  <footer th:replace="~{fragments/base :: pie}"></footer>
</body>
</html>
