<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Validación del stack')}"></head>
<body>
  <header th:replace="~{fragments/base :: cabecera}"></header>
  <main class="pagina">
    <h1><span>Periodismo</span> Seguro: validación del stack</h1>
    <ul>
      <li>Spring Boot + Thymeleaf: OK (esta página)</li>
      <li>JPA: <span th:text="${total}">0</span> mensajes guardados en la base de datos</li>
      <li>WebSocket: <span id="estado">desconectado</span></li>
    </ul>
    <form id="f">
      <div class="campo">
        <label for="t">Mensaje de prueba</label>
        <input id="t" maxlength="500" autocomplete="off">
      </div>
      <button class="boton principal">Enviar</button>
    </form>
    <ul id="log"><li th:each="m : ${mensajes}" th:text="${m.texto}"></li></ul>
    <p><a th:href="@{/registro}">Registrarme como periodista</a></p>
  </main>
  <footer th:replace="~{fragments/base :: pie}"></footer>
  <script th:src="@{/js/chat.js}"></script>
</body>
</html>
