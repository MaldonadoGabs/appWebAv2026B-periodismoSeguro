server.port=${PORT:8080}
server.forward-headers-strategy=framework
# HU-25 y HU-26: no incluir stack trace ni datos internos en las paginas de error.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
# Local: H2 en memoria. En Azure se sobreescribe con DB_URL / DB_USER / DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:h2:mem:periodismo}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# HU-01: catalogo de categorias en tabla propia, cargado por data.sql tambien en PostgreSQL.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
management.endpoints.web.exposure.include=health

# URL publica usada en los enlaces de recuperacion. En Azure: APP_URL_PUBLICA=https://<tu-app>.azurecontainerapps.io
app.url-publica=${APP_URL_PUBLICA:http://localhost:${server.port:8080}}
# Correo de recuperacion: consola (por defecto, solo imprime el enlace) o resend (correo real)
app.correo.proveedor=${APP_CORREO_PROVEEDOR:consola}
app.correo.remitente=${APP_CORREO_REMITENTE:Periodismo Seguro <onboarding@resend.dev>}
app.correo.resend.api-key=${RESEND_API_KEY:}

# HU-09: imagenes de las noticias en disco local. En Azure el disco es efimero:
# apunta APP_IMAGENES_DIR a un volumen persistente o migra el almacenamiento a BD/blob.
app.imagenes.directorio=${APP_IMAGENES_DIR:${java.io.tmpdir}/periodismo-seguro/imagenes}
# HU-25: sesion segura. HttpOnly siempre; Secure solo en produccion (HTTPS); SameSite=Lax.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
# HU-25: en produccion (APP_PRODUCCION=true) se activa Secure en la cookie.
server.servlet.session.cookie.secure=${APP_PRODUCCION:false}
app.produccion=${APP_PRODUCCION:false}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
