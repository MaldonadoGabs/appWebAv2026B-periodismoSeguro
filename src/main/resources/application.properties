server.port=${PORT:8080}
server.forward-headers-strategy=framework
# Local: H2 en memoria. En Azure se sobreescribe con DB_URL / DB_USER / DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:h2:mem:periodismo}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health

# HU-16: catalogo de categorias. defer = el script corre despues de que Hibernate cree las tablas;
# always = corre tambien con PostgreSQL en Azure (el valor por defecto 'embedded' solo corre con H2).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# URL publica usada en los enlaces de recuperacion. En Azure: APP_URL_PUBLICA=https://<tu-app>.azurecontainerapps.io
app.url-publica=${APP_URL_PUBLICA:http://localhost:${server.port:8080}}
# Correo de recuperacion: consola (por defecto, solo imprime el enlace) o resend (correo real)
app.correo.proveedor=${APP_CORREO_PROVEEDOR:consola}
app.correo.remitente=${APP_CORREO_REMITENTE:Periodismo Seguro <onboarding@resend.dev>}
app.correo.resend.api-key=${RESEND_API_KEY:}

# HU-09: imagenes de las noticias en disco local. En Azure el disco es efimero:
# apunta APP_IMAGENES_DIR a un volumen persistente o migra el almacenamiento a BD/blob.
app.imagenes.directorio=${APP_IMAGENES_DIR:${java.io.tmpdir}/periodismo-seguro/imagenes}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
