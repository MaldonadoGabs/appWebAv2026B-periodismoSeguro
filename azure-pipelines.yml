trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  sufijo: psa26
  rg: rg-periodismo-$(sufijo)
  acr: acrperiodismo$(sufijo)
  app: ca-periodismo-$(sufijo)
  azureConnection: sc-azure

stages:
- stage: Build
  jobs:
  - job: Test
    steps:
    - task: Maven@4
      inputs:
        mavenPomFile: pom.xml
        goals: verify
        javaHomeOption: JDKVersion
        jdkVersionOption: '1.21'
    # Aunque las pruebas fallen, se publica el detalle de cual fallo en la pestana Tests.
    - task: PublishTestResults@2
      displayName: Publicar resultados de las pruebas
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: '**/target/surefire-reports/TEST-*.xml'
        failTaskOnFailedTests: false
- stage: Deploy
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: DeployAca
    steps:
    - task: AzureCLI@2
      displayName: Build imagen en ACR y desplegar en Container Apps
      env:
        RESEND_API_KEY: $(resend_api_key)
      inputs:
        azureSubscription: $(azureConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e
          az extension add --name containerapp -y
          TAG=$(Build.BuildId)
          # Se construye en el agente con Docker (ACR Tasks no existe en todas las regiones, p. ej. belgiumcentral)
          az acr update -n $(acr) --admin-enabled true -o none
          ACR_USER=$(az acr credential show -n $(acr) --query username -o tsv)
          ACR_PASS=$(az acr credential show -n $(acr) --query "passwords[0].value" -o tsv)
          echo "$ACR_PASS" | docker login $(acr).azurecr.io -u "$ACR_USER" --password-stdin
          docker build -t $(acr).azurecr.io/periodismo:$TAG .
          docker push $(acr).azurecr.io/periodismo:$TAG
          FQDN=$(az containerapp show -n $(app) -g $(rg) --query properties.configuration.ingress.fqdn -o tsv)
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "Falta el secreto resend_api_key en Azure DevOps"
            exit 1
          fi
          az containerapp secret set -n $(app) -g $(rg) --secrets resend-api-key="$RESEND_API_KEY" -o none
          # Produccion: cookie Secure, URL publica y correo de recuperacion via Resend
          az containerapp update -n $(app) -g $(rg) --image $(acr).azurecr.io/periodismo:$TAG \
            --set-env-vars APP_PRODUCCION=true APP_URL_PUBLICA=https://$FQDN \
              APP_CORREO_PROVEEDOR=resend RESEND_API_KEY=secretref:resend-api-key \
              "APP_CORREO_REMITENTE=Periodismo Seguro <onboarding@resend.dev>"
          echo "Desplegado: https://$FQDN"
          sleep 30
          curl -fsS https://$FQDN/actuator/health
